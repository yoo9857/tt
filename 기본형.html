<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기본 페이지</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Pretendard", "Malgun Gothic", sans-serif;
      background: #f7f7f7;
      color: #222;
      line-height: 1.6;
    }
    header, footer {
      background: #222;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background: #fff;
      border-radius: 8px;
    }
    h2 { margin-bottom: 12px; }
    footer { font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <h1>제목</h1>
  </header>

  <main>
    <h2>소제목</h2>
    <p>여기에 내용을 입력하세요.</p>
  </main>

  <footer>
    <p>&copy; 2026</p>
  </footer>

</body>
</html>
